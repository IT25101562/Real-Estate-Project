<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResellLK | My Bookings</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: rgba(25, 25, 25, 0.6);
            --gold: #D4AF37;
            --gold-hover: #F3E5AB;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Abstract luxury background */
        .bg-layer {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
                        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
            animation: slowSpin 60s linear infinite;
        }

        @keyframes slowSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navbar */
        .navbar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5rem;
            background: rgba(10,10,10,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }
        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: 2px;
        }
        .nav-brand span { color: var(--gold); }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--gold); }

        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        .section-title {
            font-size: 3rem;
            font-weight: 300;
            margin: 0 0 0.5rem 0;
            letter-spacing: -1px;
        }
        .section-subtitle {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 1.1rem;
            margin: 0;
        }

        .btn-accent {
            padding: 1rem 2rem;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 99px;
            font-family: inherit;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-accent:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(212,175,55,0.5);
        }

        /* Filters */
        .filter-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.6rem 1.5rem;
            border-radius: 99px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

        /* Grid & Cards */
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .booking-card {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: slideUp 0.6s ease forwards;
        }
        .booking-card:hover {
            border-color: rgba(212,175,55,0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Status Pills */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 1rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .PENDING .status-pill   { background: rgba(217, 119, 6, 0.15); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .CONFIRMED .status-pill { background: rgba(5, 150, 105, 0.15); color: #34D399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .CANCELLED .status-pill { background: rgba(220, 38, 38, 0.15); color: #F87171; border: 1px solid rgba(248, 113, 113, 0.3); }

        .card-date {
            font-size: 1.75rem;
            font-weight: 300;
            color: white;
            margin: 1.5rem 0 0.5rem;
        }
        .card-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .card-meta i { color: var(--gold); }

        .card-actions {
            display: flex;
            gap: 1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
        .btn-card {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-edit { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border-color); }
        .btn-edit:hover { background: rgba(255,255,255,0.1); border-color: white; }
        .btn-cancel { background: rgba(239, 68, 68, 0.1); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-cancel:hover { background: rgba(239, 68, 68, 0.2); border-color: #F87171; }
        .btn-delete { background: transparent; color: var(--text-muted); }
        .btn-delete:hover { color: #F87171; }

        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 500;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open { display: flex; opacity: 1; }
        .modal-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal-backdrop.open .modal-box { transform: scale(1); }
        
        .modal-box h3 { margin: 0 0 2rem; font-weight: 300; font-size: 1.5rem; }
        
        .input-group { position: relative; margin-bottom: 2.5rem; }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0 0.5rem;
            color: white;
            font-family: inherit;
            font-size: 1.1rem;
        }
        .input-group input:focus { outline: none; border-bottom-color: var(--gold); }
        .input-group label {
            position: absolute;
            left: 0;
            top: -0.5rem;
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            background: rgba(255,255,255,0.02);
            border-radius: 1.5rem;
            border: 1px dashed var(--border-color);
        }
        .empty-state i { font-size: 3rem; color: var(--border-color); margin-bottom: 1.5rem; }

        @media (max-width: 768px) {
            .header-section { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
            .navbar { padding: 1rem 2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>

    <div id="common-navbar"></div>

    <div class="page-wrapper">
        <div class="header-section">
            <div>
                <h1 class="section-title">My Schedule</h1>
                <p class="section-subtitle">Manage your private property viewings</p>
            </div>
            <a href="/inquiry-form.html" class="btn-accent">
                <i class="fas fa-plus"></i> Request Showing
            </a>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterStatus('ALL', this)">All Viewings</button>
            <button class="filter-btn" onclick="filterStatus('PENDING', this)">Pending</button>
            <button class="filter-btn" onclick="filterStatus('CONFIRMED', this)">Confirmed</button>
            <button class="filter-btn" onclick="filterStatus('CANCELLED', this)">Cancelled</button>
        </div>

        <div class="bookings-grid" id="bookingsGrid">
            <div style="grid-column:1/-1; text-align:center; padding:3rem;">
                <i class="fas fa-circle-notch fa-spin fa-2x" style="color:var(--gold);"></i>
            </div>
        </div>
    </div>

    <!-- Reschedule Modal -->
    <div class="modal-backdrop" id="rescheduleModal">
        <div class="modal-box">
            <h3><i class="fas fa-calendar-alt" style="color:var(--gold); margin-right:10px;"></i> Reschedule Viewing</h3>
            <div class="input-group">
                <input type="datetime-local" id="newDateTime">
                <label>New Date & Time</label>
            </div>
            <div style="display:flex; gap:1rem;">
                <button class="btn-accent" style="flex:1; justify-content:center; padding:1rem;" onclick="saveReschedule()">Confirm</button>
                <button class="btn-card btn-edit" style="flex:1;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const MOCK_BUYER_ID = 1;
        let allBookings = [];
        let rescheduleId = null;

        async function loadBookings() {
            try {
                const res = await fetch(`/api/interactions/booking/buyer/${MOCK_BUYER_ID}`);
                if (res.ok) {
                    allBookings = await res.json();
                    renderBookings(allBookings);
                }
            } catch (e) { console.error(e); }
        }

        function renderBookings(bookings) {
            const grid = document.getElementById('bookingsGrid');
            grid.innerHTML = '';

            if (bookings.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3 style="font-weight:300; font-size:1.5rem; margin-bottom:1rem;">No Viewings Found</h3>
                        <p style="color:var(--text-muted); margin-bottom:2rem;">You haven't scheduled any property viewings in this category.</p>
                        <a href="/inquiry-form.html" class="btn-accent" style="border-radius:99px;">Explore Properties</a>
                    </div>`;
                return;
            }

            bookings.forEach((b, i) => {
                const d = new Date(b.scheduledTime);
                const dateStr = d.toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
                const timeStr = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });

                const canCancel = b.status === 'PENDING' || b.status === 'CONFIRMED';
                const canEdit   = b.status === 'PENDING';

                const card = document.createElement('div');
                card.className = `booking-card ${b.status}`;
                card.style.animationDelay = `${i * 0.1}s`;

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span class="status-pill"><i class="fas ${b.status==='CONFIRMED'?'fa-check':b.status==='CANCELLED'?'fa-times':'fa-hourglass-half'}"></i> ${b.status}</span>
                        <span style="color:var(--border-color); font-size:0.8rem;">#${b.id}</span>
                    </div>
                    <div class="card-date">${dateStr}</div>
                    <div class="card-meta">
                        <span><i class="fas fa-clock"></i> ${timeStr}</span>
                        <span><i class="fas fa-home"></i> Property #${b.propertyId}</span>
                    </div>
                    <div class="card-actions">
                        ${canEdit ? `<button class="btn-card btn-edit" onclick="openReschedule(${b.id})"><i class="fas fa-edit"></i> Reschedule</button>` : ''}
                        ${canCancel ? `<button class="btn-card btn-cancel" onclick="cancelBooking(${b.id})"><i class="fas fa-times"></i> Cancel</button>` : ''}
                        ${!canCancel ? `<button class="btn-card btn-delete" onclick="deleteBooking(${b.id})"><i class="fas fa-trash"></i> Remove Record</button>` : ''}
                    </div>`;
                grid.appendChild(card);
            });
        }

        function filterStatus(status, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = status === 'ALL' ? allBookings : allBookings.filter(b => b.status === status);
            renderBookings(filtered);
        }

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this viewing?')) return;
            const res = await fetch(`/api/interactions/booking/${id}/cancel`, { method: 'PUT' });
            if (res.ok) { await loadBookings(); } else { alert(await res.text()); }
        }

        async function deleteBooking(id) {
            if (!confirm('Permanently remove this booking record?')) return;
            const res = await fetch(`/api/interactions/booking/${id}`, { method: 'DELETE' });
            if (res.ok) { await loadBookings(); } else { alert(await res.text()); }
        }

        function openReschedule(id) {
            rescheduleId = id;
            document.getElementById('rescheduleModal').classList.add('open');
        }

        function closeModal() {
            rescheduleId = null;
            document.getElementById('rescheduleModal').classList.remove('open');
        }

        async function saveReschedule() {
            const raw = document.getElementById('newDateTime').value;
            if (!raw) { alert('Please select a valid date and time.'); return; }
            const scheduledTime = raw.length === 16 ? raw + ':00' : raw;
            const res = await fetch(`/api/interactions/booking/${rescheduleId}/reschedule`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ scheduledTime })
            });
            if (res.ok) { closeModal(); await loadBookings(); } else { alert(await res.text()); }
        }

        loadBookings();

        // Load common navbar
        fetch('/navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('common-navbar').innerHTML = html);
    </script>
</body>
</html>
