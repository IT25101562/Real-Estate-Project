# =====================================================
# Microsoft SQL Server Database Configuration
# Real Estate Admin Management System
# =====================================================

# Database Connection Settings
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ⚠️ IMPORTANT: If using SQL Server Express, the instance name is usually localhost\SQLEXPRESS
# Example: jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS;databaseName=RealEstateDB;encrypt=true;trustServerCertificate=true
db.url=jdbc:sqlserver://localhost:1433;databaseName=RealEstateDB;encrypt=true;trustServerCertificate=true

db.username=sa

# ⚠️ REPLACE THIS with your actual SQL Server 'sa' password!
# If you leave it as 'YOUR_ACTUAL_PASSWORD', login will NOT work.
db.password=AdminPassword123!@#

# Connection Pool Settings
db.pool.maxSize=10
db.pool.minSize=2
