<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – EstateHub</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">🏠 EstateHub</div>
      <ul class="nav-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main class="center-content">
    <div class="auth-container">
      <div class="text-center" style="margin-bottom:2rem;">
        <div style="width:56px;height:56px;margin:0 auto 1rem;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 8px 24px rgba(245,158,11,0.35);">🔑</div>
        <h1 style="font-size:1.65rem;margin-bottom:0.25rem;">Forgot your password?</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">No worries. We'll send you reset instructions.</p>
      </div>

      <div class="card" style="padding:2.25rem;">
        <form id="forgot-password-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            <span class="error-message"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-large">
            Send Reset Link →
          </button>
        </form>

        <!-- Info Box -->
        <div style="margin-top:1.5rem;padding:1rem 1.2rem;border-radius:var(--radius);background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.2);">
          <p style="font-size:0.83rem;color:var(--text-muted);margin:0;line-height:1.6;">
            <span style="color:var(--info);font-weight:600;">ℹ Tip:</span>
            Check your inbox <em>and</em> spam folder. The link expires in 24 hours.
          </p>
        </div>

        <div class="text-center mt-3">
          <a href="login.html" style="font-size:0.88rem;font-weight:600;">← Back to Login</a>
        </div>
      </div>
    </div>
  </main>

  <footer><p>© 2026 EstateHub. All rights reserved.</p></footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('forgot-password-form');
      const validationRules = { email: { required: true, email: true, name: 'Email' } };
      setupFormValidation(form, validationRules);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validateForm(form, validationRules)) { showAlert('Please enter a valid email address', 'error'); return; }
        const email = document.getElementById('email').value.trim();
        try {
          disableForm(form);
          showAlert('Sending reset link...', 'info', 0);
          const response = await forgotPassword(email);
          showAlert(response.message || 'Reset link sent! Check your email.', 'success', 5000);
          clearForm(form);
          setTimeout(() => { window.location.href = 'login.html'; }, 5000);
        } catch (error) {
          enableForm(form);
          showAlert(error.message || 'Failed to send reset link.', 'error');
        }
      });
    });
  </script>
</body>
</html>
