<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management – EstateHub</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .search-bar {
      position: relative; flex: 1; max-width: 340px;
    }
    .search-bar input {
      padding-left: 2.5rem; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border); border-radius: var(--radius);
      color: var(--text); font-size: 0.88rem; width: 100%;
    }
    .search-bar::before {
      content: '🔍'; position: absolute; left: 0.85rem; top: 50%;
      transform: translateY(-50%); font-size: 0.85rem; z-index: 1;
    }
    .empty-state {
      text-align: center; padding: 4rem 2rem; color: var(--text-dim);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .count-badge {
      display: inline-flex; align-items: center;
      background: var(--primary-light); color: var(--primary);
      padding: 0.15rem 0.6rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">🏠 EstateHub</div>
      <ul class="nav-links">
        <li><a href="users.html">Users</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><button id="logout-btn" class="btn btn-outline" style="padding:0.4rem 1rem;font-size:0.85rem;">Logout</button></li>
      </ul>
    </nav>
  </header>

  <main style="padding:2.5rem 1rem 4rem;">
    <div class="container">

      <!-- Page Header -->
      <div style="margin-bottom:2rem;">
        <h1 style="font-size:1.75rem;margin-bottom:0.3rem;">User Management</h1>
        <p style="color:var(--text-muted);font-size:0.92rem;">View and manage all registered users on the platform.</p>
      </div>

      <!-- Toolbar -->
      <div class="card" style="margin-bottom:1.5rem;padding:1.25rem 1.75rem;">
        <div class="flex-between" style="flex-wrap:wrap;gap:1rem;">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <span style="font-size:0.9rem;color:var(--text-muted);">Total users:</span>
            <span class="count-badge" id="user-count">—</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
            <div class="search-bar">
              <input type="text" id="search-input" placeholder="Search users…">
            </div>
            <button class="btn btn-secondary" onclick="loadUsers()" style="font-size:0.85rem;padding:0.55rem 1rem;">
              🔄 Refresh
            </button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-container">
          <table id="users-table">
            <thead>
              <tr>
                <th style="padding-left:1.5rem;">User</th>
                <th>Email</th>
                <th>Phone</th>
                <th>City</th>
                <th>Status</th>
                <th>Joined</th>
                <th style="padding-right:1.5rem;">Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="7" class="text-center" style="padding:3rem;color:var(--text-dim);">
                <div class="spinner"></div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer><p>© 2026 EstateHub. All rights reserved.</p></footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    let allUsers = [];

    document.addEventListener('DOMContentLoaded', async function() {
      requireLogin();
      await loadUsers();

      document.getElementById('search-input').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        const filtered = allUsers.filter(u =>
          `${u.firstName} ${u.lastName}`.toLowerCase().includes(q) ||
          u.email.toLowerCase().includes(q) ||
          (u.city || '').toLowerCase().includes(q)
        );
        renderUsers(filtered);
      });
    });

    async function loadUsers() {
      document.getElementById('users-tbody').innerHTML =
        '<tr><td colspan="7" style="text-align:center;padding:3rem;"><div class="spinner"></div></td></tr>';
      try {
        const response = await getAllUsers();
        allUsers = response.data || [];
        document.getElementById('user-count').textContent = allUsers.length;
        renderUsers(allUsers);
      } catch (error) {
        document.getElementById('users-tbody').innerHTML =
          '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--error);">Failed to load users. Please refresh.</td></tr>';
        showAlert('Failed to load users.', 'error');
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('users-tbody');
      if (!users || users.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="7">
            <div class="empty-state">
              <div class="empty-icon">👥</div>
              <p style="font-weight:600;color:var(--text-muted);margin-bottom:0.4rem;">No users found</p>
              <p style="font-size:0.85rem;">Try adjusting your search or refreshing the list.</p>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      users.forEach(user => {
        const initials = (user.firstName[0] + user.lastName[0]).toUpperCase();
        const statusBadge = user.isActive
          ? '<span class="badge badge-success">● Active</span>'
          : '<span class="badge badge-error">● Inactive</span>';
        const joined = user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-US', { month:'short', year:'numeric' }) : '—';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="padding-left:1.5rem;">
            <div style="display:flex;align-items:center;gap:0.75rem;">
              <div class="user-avatar">${initials}</div>
              <strong>${user.firstName} ${user.lastName}</strong>
            </div>
          </td>
          <td>${user.email}</td>
          <td>${user.phoneNumber || '<span style="color:var(--text-dim);">—</span>'}</td>
          <td>${user.city || '<span style="color:var(--text-dim);">—</span>'}</td>
          <td>${statusBadge}</td>
          <td>${joined}</td>
          <td style="padding-right:1.5rem;">
            <button class="btn btn-danger" onclick="handleDelete(${user.id})" style="font-size:0.8rem;padding:0.4rem 0.9rem;">
              🗑️ Delete
            </button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    async function handleDelete(userId) {
      if (!confirm('Are you sure you want to permanently delete this user?')) return;
      try {
        showAlert('Deleting user...', 'info', 0);
        await deleteUser(userId);
        showAlert('User deleted successfully.', 'success');
        const currentUser = getUserSession();
        if (currentUser && currentUser.id == userId) { logoutUser(); window.location.href = 'login.html'; }
        else { await loadUsers(); }
      } catch (error) {
        showAlert('Failed to delete user.', 'error');
      }
    }
  </script>
</body>
</html>
