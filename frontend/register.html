<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – RealEstate Portal</title>
  <meta name="description" content="Create your free Real Estate Portal account.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">🏠 EstateHub</div>
      <ul class="nav-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main style="padding:3rem 1rem;">
    <div style="max-width:640px;margin:0 auto;">
      <!-- Header -->
      <div class="text-center" style="margin-bottom:2rem;">
        <div style="width:56px;height:56px;margin:0 auto 1rem;border-radius:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 8px 24px rgba(99,102,241,0.4);">✨</div>
        <h1 style="font-size:1.75rem;margin-bottom:0.25rem;">Create your account</h1>
        <p style="color:var(--text-muted);font-size:0.92rem;">Join thousands of property seekers and listers</p>
      </div>

      <div class="card" style="padding:2.25rem;">
        <form id="registration-form" autocomplete="on">
          <!-- Name Row -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" placeholder="John" required autocomplete="given-name">
              <span class="error-message"></span>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" placeholder="Doe" required autocomplete="family-name">
              <span class="error-message"></span>
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            <span class="error-message"></span>
          </div>

          <!-- Password Row -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
              <span class="error-message"></span>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
              <span class="error-message"></span>
            </div>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phoneNumber">Phone Number <span style="color:var(--text-dim);font-size:0.75rem;text-transform:none;letter-spacing:0;">(Optional)</span></label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+1 (555) 000-0000" autocomplete="tel">
            <span class="error-message"></span>
          </div>

          <!-- Address -->
          <div class="form-group">
            <label for="address">Street Address <span style="color:var(--text-dim);font-size:0.75rem;text-transform:none;letter-spacing:0;">(Optional)</span></label>
            <input type="text" id="address" name="address" placeholder="123 Main Street" autocomplete="street-address">
            <span class="error-message"></span>
          </div>

          <!-- City/State/ZIP -->
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" placeholder="New York" autocomplete="address-level2">
              <span class="error-message"></span>
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" name="state" placeholder="NY" autocomplete="address-level1">
              <span class="error-message"></span>
            </div>
            <div class="form-group">
              <label for="zipCode">ZIP</label>
              <input type="text" id="zipCode" name="zipCode" placeholder="10001" autocomplete="postal-code">
              <span class="error-message"></span>
            </div>
          </div>

          <!-- Terms -->
          <label style="display:flex;align-items:flex-start;gap:0.65rem;margin-bottom:1.5rem;cursor:pointer;font-size:0.88rem;color:var(--text-muted);line-height:1.5;">
            <input type="checkbox" id="terms" name="terms" required style="width:auto;margin-top:0.2rem;accent-color:var(--primary);">
            <span>I agree to the <a href="#" style="font-weight:600;">Terms of Service</a> and <a href="#" style="font-weight:600;">Privacy Policy</a></span>
          </label>

          <button type="submit" class="btn btn-primary btn-block btn-large">
            Create Account →
          </button>
        </form>

        <div class="divider">or</div>
        <div class="text-center" style="font-size:0.88rem;color:var(--text-muted);">
          Already have an account? <a href="login.html" style="font-weight:600;margin-left:0.25rem;">Sign in</a>
        </div>
      </div>
    </div>
  </main>

  <footer><p>© 2026 EstateHub. All rights reserved.</p></footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      redirectIfLoggedIn();
      const form = document.getElementById('registration-form');
      const validationRules = {
        firstName:       { required: true, minLength: 2, maxLength: 100, name: 'First Name' },
        lastName:        { required: true, minLength: 2, maxLength: 100, name: 'Last Name' },
        email:           { required: true, email: true, name: 'Email' },
        password:        { required: true, password: true, minLength: 6, name: 'Password' },
        confirmPassword: { required: true, match: '#password', name: 'Confirm Password' },
        phoneNumber:     { phone: true, name: 'Phone Number' },
        zipCode:         { zip: true, name: 'ZIP Code' }
      };
      setupFormValidation(form, validationRules);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!document.getElementById('terms').checked) { showAlert('Please agree to the Terms of Service', 'error'); return; }
        if (!validateForm(form, validationRules)) { showAlert('Please fix the errors in the form', 'error'); return; }
        const formData = {
          firstName:   document.getElementById('firstName').value.trim(),
          lastName:    document.getElementById('lastName').value.trim(),
          email:       document.getElementById('email').value.trim(),
          password:    document.getElementById('password').value.trim(),
          phoneNumber: document.getElementById('phoneNumber').value.trim() || null,
          address:     document.getElementById('address').value.trim() || null,
          city:        document.getElementById('city').value.trim() || null,
          state:       document.getElementById('state').value.trim() || null,
          zipCode:     document.getElementById('zipCode').value.trim() || null
        };
        try {
          disableForm(form);
          showAlert('Creating your account...', 'info', 0);
          const response = await registerUser(formData);
          storeUserSession(response.data);
          showAlert('Account created! Redirecting…', 'success', 1500);
          setTimeout(() => { window.location.href = `profile.html?userId=${response.data.id}`; }, 1500);
        } catch (error) {
          enableForm(form);
          showAlert(error.message || 'Registration failed. Please try again.', 'error');
        }
      });
    });
  </script>
</body>
</html>
